name: Update Profile Cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=YEY11&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=YEY11&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate contribution graph and WakaTime card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKA_TOKEN: ${{ secrets.WAKATIME_API_KEY }}
          PROFILE_USER: YEY11
        run: python3 .github/scripts/render-extra-cards.py

      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg profile/activity.svg profile/wakatime.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update profile statistic cards'
          git pull --rebase origin main
          git push origin HEAD:main
